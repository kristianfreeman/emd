name: Emd
options:
  bundleIdPrefix: com.kristianfreeman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
  postGenCommand: sed -i '' '/path = AppIcon.icon/s/lastKnownFileType = wrapper.icon/lastKnownFileType = folder.iconcomposer.icon/' Emd.xcodeproj/project.pbxproj
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: Kristian Freeman (RDHD7QCV9G)"
    CODE_SIGNING_REQUIRED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Emd:
    type: application
    platform: macOS
    sources:
      - path: Emd
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristianfreeman.emd
        PRODUCT_NAME: Emd
        PRODUCT_MODULE_NAME: Emd
        INFOPLIST_FILE: Emd/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          ENABLE_TESTABILITY: NO
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
  EmdTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EmdTests
    dependencies:
      - target: Emd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristianfreeman.emd.tests
        PRODUCT_NAME: EmdTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Emd.app/Contents/MacOS/Emd"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Emd:
    build:
      targets:
        Emd: all
        EmdTests: [test]
    test:
      targets:
        - EmdTests
    run:
      config: Debug
