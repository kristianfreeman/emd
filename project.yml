name: EmDashWriter
options:
  bundleIdPrefix: com.kristianfreeman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
  postGenCommand: sed -i '' '/path = AppIcon.icon/s/lastKnownFileType = wrapper.icon/lastKnownFileType = folder.iconcomposer.icon/' EmDashWriter.xcodeproj/project.pbxproj
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: Kristian Freeman (RDHD7QCV9G)"
    CODE_SIGNING_REQUIRED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EmDashWriter:
    type: application
    platform: macOS
    sources:
      - path: emdash-writer
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristianfreeman.emdash-writer
        PRODUCT_NAME: Emd
        PRODUCT_MODULE_NAME: EmDashWriter
        INFOPLIST_FILE: emdash-writer/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          ENABLE_TESTABILITY: NO
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
  EmDashWriterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: emdash-writerTests
    dependencies:
      - target: EmDashWriter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristianfreeman.emdash-writer.tests
        PRODUCT_NAME: EmDashWriterTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Emd.app/Contents/MacOS/Emd"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  EmDashWriter:
    build:
      targets:
        EmDashWriter: all
        EmDashWriterTests: [test]
    test:
      targets:
        - EmDashWriterTests
    run:
      config: Debug
